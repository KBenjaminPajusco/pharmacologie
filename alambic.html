<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060b0c">
<title>L’Alambic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* L'Alambic — officine d'alchimiste pharmaceutique : verrerie, étiquettes d'apothicaire, néon menthe/magenta. Thème sombre unique. */
:root{
  color-scheme:dark;
  --bg:#060b0c; --line:rgba(125,255,207,.18); --line2:rgba(125,255,207,.38);
  --fg:#e8fff6; --mute:#8fb7ab; --neon:#7dffcf; --neon2:#ff5fd2; --amber:#ffbe55; --brass:#c9a35a;
  --parch:#efe1bf; --ink:#2a1b0e; --ink2:#6b4a26; --bad:#ff5468; --ok:#8dff9e;
  --f-fell:"IM Fell English SC","IM Fell English",Georgia,serif;
  --f-it:"IM Fell English",Georgia,"Times New Roman",serif;
  --f-body:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.4;overflow-x:hidden;min-height:100vh;min-height:100dvh}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(120% 55% at 50% -12%,rgba(125,255,207,.15),transparent 62%),
   radial-gradient(70% 45% at 112% 102%,rgba(255,95,210,.13),transparent 62%),
   radial-gradient(60% 40% at -10% 70%,rgba(255,190,85,.06),transparent 60%),
   repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 46px),
   repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 46px),
   var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{max-width:480px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(14px,env(safe-area-inset-left,0px))}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;min-height:54px}
.ibtn{flex:0 0 44px;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);display:grid;place-items:center;color:var(--neon);text-decoration:none}
.ibtn svg{width:22px;height:22px}
.ibtn[aria-pressed=false]{color:var(--mute)}
.brand{flex:1 1 auto;min-width:0;overflow:hidden;font-family:var(--f-fell);font-size:25px;line-height:1;color:var(--parch);text-shadow:0 0 14px rgba(125,255,207,.35);white-space:nowrap}
.brand small{display:block;margin-top:3px;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.22em;color:var(--mute);text-transform:uppercase;text-shadow:none;overflow:hidden;text-overflow:ellipsis}
.xp{flex:0 0 96px}
.xp-top{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.xp-top b{color:var(--amber)}
.xp-bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}
.xp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--amber));box-shadow:0 0 8px var(--neon);transition:width .6s}

/* Modes */
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:6px 0 10px}
.mode{min-height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(10,24,22,.75);font-family:var(--f-mono);font-size:10px;letter-spacing:.02em;text-transform:uppercase;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;min-width:0;overflow:hidden}
.mode .g{font-family:var(--f-fell);font-size:17px;line-height:1;text-transform:none}
.mode[aria-pressed=true]{color:#04221a;background:var(--neon);border-color:var(--neon);box-shadow:0 0 18px rgba(125,255,207,.45)}

/* Parchemin de commande */
.order{position:relative;min-width:0;background:linear-gradient(180deg,#f4e7c8,#e0ca99);color:var(--ink);border-radius:5px 5px 12px 12px;padding:11px 13px 12px;
  box-shadow:0 0 0 1px #7b5a2c,0 0 0 4px rgba(239,225,191,.07),0 12px 28px rgba(0,0,0,.5)}
.order::before{content:"";position:absolute;inset:4px;border:1px dashed rgba(107,74,38,.42);border-radius:3px 3px 9px 9px;pointer-events:none}
.o-k{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.o-k .stars{letter-spacing:.1em;color:#a0611a;font-size:12px}
.o-t{font-family:var(--f-fell);font-size:27px;line-height:1.02;margin:4px 0 2px;overflow-wrap:anywhere}
.o-s{font-family:var(--f-it);font-style:italic;font-size:14.5px;color:var(--ink2)}
.o-row{display:flex;gap:8px;margin-top:8px;position:relative;z-index:1}
.o-row select,.o-row button{min-height:44px;border-radius:8px;border:1px solid rgba(107,74,38,.55);background:rgba(255,255,255,.35);color:var(--ink);font-family:var(--f-body);font-size:13px;padding:0 10px}
.o-row select{flex:1;min-width:0}
.client{display:flex;gap:11px;align-items:flex-start;margin-top:6px}
.medal{flex:0 0 50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:27px;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 55%),var(--cc);box-shadow:0 0 0 2px #7b5a2c,0 0 0 5px rgba(123,90,44,.18)}
.who{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.say{font-family:var(--f-it);font-size:17px;line-height:1.22}
.timer{height:7px;border-radius:5px;background:rgba(42,27,14,.16);margin-top:9px;overflow:hidden;position:relative;z-index:1}
.timer i{display:block;height:100%;width:100%;background:#2bbd8a;transition:width .25s linear,background .4s}
.combo{font-weight:700;color:#a3266a}

/* Scène du chaudron */
.stage{position:relative;margin-top:10px;border-radius:16px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(70% 90% at 42% 72%,rgba(125,255,207,.07),transparent 70%),linear-gradient(180deg,rgba(10,22,21,.55),rgba(4,9,9,.92));transition:box-shadow .2s}
.stage canvas{display:block;width:100%;height:212px;touch-action:manipulation;cursor:pointer}
.stage.drop{box-shadow:0 0 0 2px var(--neon),inset 0 0 40px rgba(125,255,207,.35)}
.stage-tag{position:absolute;left:10px;top:8px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);pointer-events:none}
.stage-help{position:absolute;right:10px;top:8px;font-family:var(--f-it);font-style:italic;font-size:12px;color:var(--mute);pointer-events:none;max-width:45%;text-align:right}

/* Emplacements */
.slots{display:grid;gap:6px;margin-top:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
.slots.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.slots.n5{grid-template-columns:repeat(6,minmax(0,1fr))}
.slots.n5>*{grid-column:span 2}
.slots.n5>:nth-child(n+4){grid-column:span 3}
.slots.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.slot{min-height:60px;border-radius:10px;border:1px dashed var(--line2);background:rgba(125,255,207,.035);padding:6px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--fg);position:relative;min-width:0}
.slot .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--neon);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .v{font-family:var(--f-it);font-size:14px;line-height:1.13;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--mute)}
.slot.long .v{font-size:12px;line-height:1.18;-webkit-line-clamp:4;overflow-wrap:anywhere}
.slot.flask .v{-webkit-line-clamp:3;overflow-wrap:anywhere}
.slot.filled{border-style:solid;background:rgba(125,255,207,.08)}
.slot.filled .v{color:var(--parch)}
.slot.active{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 16px rgba(125,255,207,.35)}
.slot.good{border:1px solid var(--ok);background:rgba(141,255,158,.09)}
.slot.good .k{color:var(--ok)}
.slot.good .k::after{content:" ✓"}
.slot.bad{border:1px solid var(--bad);background:rgba(255,84,104,.12);animation:shake .45s}
.slot.flask{border:1px solid var(--c);background:linear-gradient(180deg,rgba(255,255,255,.06),transparent);box-shadow:inset 0 -18px 30px -18px var(--c);cursor:default}
.slot.flask .k{color:var(--c)}
.slot.flask.poured{box-shadow:inset 0 -40px 40px -20px var(--c),0 0 14px -4px var(--c)}

/* Indice */
.hint{overflow-wrap:anywhere;margin-top:8px;padding:9px 11px;border-radius:9px;background:rgba(255,84,104,.08);border-left:3px solid var(--bad);font-size:14px;color:#ffd9de}
.hint p{margin:0}
.hint p+p{margin-top:5px}
.hint.ok{background:rgba(141,255,158,.08);border-color:var(--ok);color:#dcffe2}
.hint.gold{background:rgba(255,190,85,.1);border-color:var(--amber);color:#ffeccb}
.hint.purple{background:rgba(255,95,210,.1);border-color:var(--neon2);color:#ffd7f4}
.hint .src{display:block;margin-top:6px;font-family:var(--f-it);font-style:italic;color:var(--mute);font-size:13.5px}
.hint b{color:#fff}

/* Étagère */
.shelf{margin-top:10px;padding:10px 10px 14px;border-radius:14px;border:1px solid rgba(201,163,90,.35);
  background:linear-gradient(180deg,rgba(64,40,18,.5),rgba(28,17,8,.82));box-shadow:inset 0 -7px 0 rgba(201,163,90,.22),inset 0 1px 0 rgba(255,255,255,.05)}
.shelf-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin:0 2px 8px}
.shelf-h b{font-family:var(--f-fell);font-size:17px;letter-spacing:.01em;text-transform:none;color:var(--parch);font-weight:normal}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chip{position:relative;min-height:56px;padding:8px 10px 8px 14px;border:0;border-radius:3px 11px 3px 11px;background:linear-gradient(180deg,#f5e9cb,#dbc493);color:var(--ink);
  font-family:var(--f-it);font-size:14.5px;line-height:1.14;text-align:left;box-shadow:0 0 0 1px #6b4a26,2px 3px 0 rgba(0,0,0,.38);touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .12s,box-shadow .12s;overflow-wrap:anywhere;hyphens:auto;min-width:0}
.chips.wide{grid-template-columns:minmax(0,1fr)}
.chips.wide .chip{font-size:13.5px;min-height:48px}
.chip::before{content:"";position:absolute;left:5px;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--chipc,#b0306f);box-shadow:0 0 6px var(--chipc)}
.chip:active{transform:translateY(1px) rotate(-.6deg)}
.chip.on{box-shadow:0 0 0 2px var(--neon),0 0 16px rgba(125,255,207,.6)}
.chip.sol::after{content:"✓";position:absolute;right:7px;top:3px;color:#127a45;font-family:var(--f-body);font-weight:700}
.ghost{position:fixed;z-index:60;pointer-events:none;width:160px;transform:translate(-50%,-70%) rotate(-5deg) scale(1.04);box-shadow:0 0 0 2px var(--neon),0 14px 30px rgba(0,0,0,.6)}
.shelf .verdict{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.shelf .note{font-family:var(--f-it);font-style:italic;color:var(--parch);font-size:14px;margin:0 2px 10px;opacity:.85}

/* Boutons */
.actions{display:flex;gap:8px;margin-top:10px}
.actions:empty{display:none}
.btn{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line2);background:rgba(125,255,207,.06);color:var(--fg);font-family:var(--f-mono);font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:12.5px;padding:0 12px}
.btn.main{background:linear-gradient(180deg,#a5ffe0,#3fd9a6);color:#03261b;border-color:transparent;box-shadow:0 0 22px rgba(125,255,207,.4)}
.btn.main:disabled{background:rgba(125,255,207,.07);color:var(--mute);box-shadow:none;border-color:var(--line);cursor:default}
.btn.main.ready{animation:pulse 1.3s ease-in-out infinite}
.btn.forge{background:linear-gradient(180deg,#ffe09a,#d98f26);color:#2b1700;border-color:transparent;box-shadow:0 0 18px rgba(255,190,85,.35);min-height:64px;font-size:13px}
.btn.curse{background:linear-gradient(180deg,#ff95e6,#b8278f);color:#2a0020;border-color:transparent;box-shadow:0 0 18px rgba(255,95,210,.35);min-height:64px;font-size:13px}
.btn small{display:block;font-family:var(--f-it);font-style:italic;text-transform:none;letter-spacing:0;font-weight:400;font-size:12.5px;opacity:.85}

/* Overlay + cartes */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(2,7,7,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow-y:auto}
.ov[hidden]{display:none}
.ov-stack{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(340px,100%)}
.ov-stack .btn{width:100%;flex:none}
.ov-cap{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);text-align:center}
.mcard{position:relative;width:100%;border-radius:18px;padding:18px 18px 16px;overflow:hidden;
  background:radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.07),transparent 60%),linear-gradient(160deg,#16292a,#091212);
  border:1px solid var(--c);box-shadow:0 0 40px -6px var(--c),0 22px 50px rgba(0,0,0,.6);animation:surge .85s cubic-bezier(.2,1.35,.4,1) both}
.mcard::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.3) 50%,transparent 58%);transform:translateX(-70%);animation:sheen 1.7s .45s ease-out both;pointer-events:none}
.mcard::before{content:"";position:absolute;inset:6px;border:1px solid rgba(255,255,255,.08);border-radius:13px;pointer-events:none}
.mc-k{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--c);padding-right:84px}
.mc-badge{position:absolute;right:12px;top:12px;font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:20px;background:var(--c);color:#04130f}
.mc-name{font-family:var(--f-fell);font-size:clamp(30px,10vw,40px);line-height:1;margin:10px 0 4px;color:#fff;text-shadow:0 0 22px var(--c);word-break:break-word}
.mc-name b{color:var(--c);font-weight:normal}
.mc-name.l{font-size:clamp(24px,7.4vw,32px);overflow-wrap:anywhere;hyphens:auto}
.mc-name.xl{font-size:clamp(20px,6vw,26px);line-height:1.08;overflow-wrap:anywhere;hyphens:auto}
.mc-kind{color:var(--amber)}
.mc-rem{margin-top:9px;font-size:12.5px;line-height:1.3;color:var(--mute);border-left:2px solid var(--c);padding-left:8px}
.mc-src{margin-top:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;color:var(--mute);overflow-wrap:anywhere}
.mc-note{font-family:var(--f-it);font-style:italic;color:var(--parch);font-size:15px}
.mc-trap{display:inline-block;margin-top:8px;background:var(--amber);color:#2b1700;font-family:var(--f-mono);font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px}
.mc-row{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;margin:12px 0 0;font-size:13.5px}
.mc-row dt{font-family:var(--f-mono);font-size:9.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.12em;padding-top:3px}
.mc-row dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mc-tip{margin-top:12px;font-family:var(--f-it);font-style:italic;color:var(--parch);font-size:15.5px;line-height:1.25;border-top:1px dashed rgba(255,255,255,.16);padding-top:9px}
.mc-m{margin-top:8px;font-family:var(--f-mono);font-size:10.5px;color:var(--mute);letter-spacing:.1em}
.mc-m span{color:var(--c)}
.quiz{width:100%;border-radius:12px;padding:16px;background:linear-gradient(180deg,#f4e7c8,#dcc493);color:var(--ink);box-shadow:0 0 0 1px #7b5a2c,0 0 50px rgba(125,255,207,.25),0 20px 40px rgba(0,0,0,.6);animation:surge .6s cubic-bezier(.2,1.3,.4,1) both}
.quiz .q-k{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.quiz .q-t{font-family:var(--f-fell);font-size:24px;line-height:1.08;margin:4px 0 4px}
.quiz .q-s{font-family:var(--f-it);font-style:italic;color:var(--ink2);margin-bottom:10px}
.qopts{display:grid;gap:8px}
.qa{min-height:50px;border-radius:10px;border:1px solid #6b4a26;background:rgba(255,255,255,.45);color:var(--ink);font-family:var(--f-fell);font-size:20px;line-height:1.12;text-align:left;padding:7px 14px;overflow-wrap:anywhere}
.qa.right{background:#9ff0b9;border-color:#127a45}
.qa.wrong{background:#ffb3bd;border-color:#a3263a;animation:shake .4s}
.big{font-family:var(--f-fell);font-size:clamp(34px,11vw,52px);line-height:1;text-align:center;color:#fff;text-shadow:0 0 30px var(--c,var(--amber)),0 0 60px var(--c,var(--amber));animation:surge 1s cubic-bezier(.2,1.35,.4,1) both}

/* Grimoire */
.gstats{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--mute);margin:0 2px 8px;display:flex;flex-wrap:wrap;gap:4px 14px}
.gstats b{color:var(--amber)}
.gtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gtabs::-webkit-scrollbar{display:none}
.gtab{flex:0 0 auto;min-height:44px;padding:0 13px;border-radius:22px;border:1px solid var(--line);background:rgba(10,24,22,.7);color:var(--mute);font-size:13px;white-space:nowrap}
.gtab .pc{font-family:var(--f-mono);font-size:10px;margin-left:6px;opacity:.85}
.gtab[aria-selected=true]{background:var(--dc);color:#111;border-color:var(--dc);box-shadow:0 0 14px -2px var(--dc)}
.gtab.done{border-color:var(--amber)}
.gpage{position:relative;padding:15px 14px 8px;border-radius:6px 6px 14px 14px;background:linear-gradient(180deg,#f2e5c4,#dac38f);color:var(--ink);box-shadow:0 0 0 1px #7b5a2c,0 14px 30px rgba(0,0,0,.5)}
.gpage::before{content:"";position:absolute;inset:5px;border:1px solid rgba(107,74,38,.35);border-radius:3px 3px 10px 10px;pointer-events:none}
.gpage.complete{box-shadow:0 0 0 2px var(--amber),0 0 46px rgba(255,190,85,.55),0 14px 30px rgba(0,0,0,.5);animation:glow 2.6s ease-in-out infinite alternate}
.gpage h2{font-family:var(--f-fell);font-size:29px;line-height:1;margin:0;font-weight:normal}
.gpage .blurb{font-family:var(--f-it);font-style:italic;color:var(--ink2);margin:2px 0 0}
.seal{position:absolute;right:14px;top:12px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--f-mono);font-size:8px;font-weight:700;letter-spacing:.06em;line-height:1.1;color:#fff4d6;background:radial-gradient(circle at 35% 30%,#ff8a7a,#a3162e 70%);box-shadow:0 0 0 2px #7a1022,0 0 18px rgba(255,190,85,.7);transform:rotate(-12deg)}
.gprog{height:7px;background:rgba(42,27,14,.16);border-radius:4px;overflow:hidden;margin:9px 0 6px}
.gprog i{display:block;height:100%;background:var(--dc)}
.gclass{padding:10px 6px;border-top:1px dashed rgba(107,74,38,.4);border-radius:8px;position:relative}
.gclass.full{background:linear-gradient(90deg,rgba(255,190,85,.32),rgba(255,190,85,.05));box-shadow:inset 3px 0 0 #d98f26}
.gclass.full .gc-n::after{content:" ✦";color:#c46a00}
.gc-h{display:flex;align-items:baseline;gap:8px}

<body>
<div class="bgfx" aria-hidden="true"></div>
<div class="app">
  <header class="hud">
    <a class="ibtn" href="index.html" aria-label="Retour à l’arcade"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="brand">L’Alambic<small>Officine des transmutations</small></div>
    <div class="xp" aria-live="polite"><div class="xp-top"><span>Niv. <b id="lvl">1</b></span><span id="xpt">0/120</span></div><div class="xp-bar"><i id="xpb"></i></div></div>
    <button class="ibtn" id="snd" aria-pressed="true" aria-label="Son activé"></button>
  </header>
  <nav class="modes" id="modes" aria-label="Modes de jeu">
    <button class="mode" data-m="atelier" aria-pressed="false"><span class="g">⚗&#xFE0E;</span>Atelier</button>
    <button class="mode" data-m="commande" aria-pressed="false"><span class="g">✉&#xFE0E;</span>Commandes</button>
    <button class="mode" data-m="forge" aria-pressed="false"><span class="g">⚒&#xFE0E;</span>Forge</button>
    <button class="mode" data-m="grimoire" aria-pressed="false"><span class="g">❦</span>Grimoire</button>
  </nav>
  <main>
    <section id="lab">
      <div class="order" id="order"></div>
      <div class="stage" id="stage">
        <canvas id="flask" role="img" aria-label="L’alambic : touche-le, ou glisse un ingrédient dedans"></canvas>
        <div class="stage-tag" id="stageTag">Cuve</div>
        <div class="stage-help" id="stageHelp">glisse ou touche un ingrédient</div>
      </div>
      <div class="slots" id="slots"></div>
      <div class="hint" id="hint" role="status" aria-live="polite" hidden></div>
      <div class="shelf" id="shelf"></div>
      <div class="actions" id="actions"></div>
    </section>
    <section id="grim" hidden></section>
  </main>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="ov" id="ov" hidden role="dialog" aria-modal="true"><div id="ovIn" style="width:100%;display:grid;place-items:center"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="molecules.js"></script><script src="progress.js"></script>

<script id="engine">
/*ENGINE-START*/
/* Générateur de recettes : pur, sans DOM (testé en node).
   Recette = Affixe (ou Molécule repère) + Cible + Indication,
   puis Mécanisme (niv. 2) et Molécule repère / Cours (niv. 3).
   Les leurres viennent d'autres classes, du même cours d'abord, et ne partagent
   aucun mot-clé avec les réponses de la classe (sauf oppositions explicites, CONTRAST). */
(function (root) {
  'use strict';
  const STOP = new Set(('les des aux une non sur par avec dans pour sans tres plus que qui est son ses leur selon type sous unite ' +
    'molecule recepteur canaux canau canal cellule effet trouble syndrome concentration derive acide forte fort grave long terme rare surtout cas debut ' +
    'inhibe inhiber inhibition inhibiteur active activation agoniste antagoniste antagonisme bloque bloquent bloqueur module modulateur modulation ' +
    'positivement augmente augmentent augmentation diminue diminuent reduit reduction potentialise action agit agissent via notamment associe ' +
    'cite cours chapitre exemple evoque comme pas detaille outil traitement prevention indication therapeutique transmission voie ' +
    'selectivement selectif selective maniere maladie crise ancien utilise utilisee forme principalement egalement').split(/\s+/));
  const SYN = {
    serotoninergique: 'serotonine', anticonvulsivant: 'epilepsie', antiepileptique: 'epilepsie', convulsion: 'epilepsie',
    insomnie: 'sommeil', hypnose: 'sommeil', hypnotique: 'sommeil', sedation: 'sommeil',
    myorelaxant: 'muscle', spasticite: 'muscle', spasme: 'muscle', contracture: 'muscle', decontractant: 'muscle',
    vomissement: 'nausee', antiemetique: 'nausee', antalgique: 'douleur', anxiolyse: 'anxiete', anxiolytique: 'anxiete',
    dopaminergique: 'dopamine', noradrenergique: 'noradrenaline', opiace: 'opioide', opioides: 'opioide'
  };

  function norm(s) {
    return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[’'`]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function stem(w) { if (w.length > 4 && /[sx]$/.test(w)) w = w.slice(0, -1); return SYN[w] || w; }
  function toks(s) {
    const out = [];
    norm(s).split(/[^a-z0-9α-ω+-]+/).map(w => w.replace(/^[-+]+|[-+]+$/g, ''))
      .filter(w => w && (w.length >= 3 || /\d/.test(w))).map(stem).filter(w => !STOP.has(w))
      .forEach(w => { out.push(w); if (/^5-ht/.test(w)) out.push('serotonine'); });
    return out;
  }
  // mode 'jac' : recouvrement fort ; sinon : un mot significatif commun suffit.
  function similar(a, b, mode) {
    const na = norm(a), nb = norm(b);
    if (!na || !nb) return false;
    if (na === nb || na.includes(nb) || nb.includes(na)) return true;
    const A = new Set(toks(a)), B = new Set(toks(b));
    let inter = 0; A.forEach(w => { if (B.has(w)) inter++; });
    if (mode === 'jac') { const uni = A.size + B.size - inter; return uni > 0 && inter / uni >= 0.5; }
    return inter > 0;
  }
  function affixCores(a) { return String(a || '').split('/').map(x => norm(x).replace(/[^a-z]/g, '')).filter(Boolean); }
  function affixClash(a, ka, b, kb) {
    if (ka !== kb) return false;
    const A = affixCores(a), B = affixCores(b);
    return A.some(x => B.some(y => x.includes(y) || y.includes(x)));
  }
  function shuffle(a, rng) { rng = rng || Math.random; a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  /* Textes trop vagues pour servir de réponse ou de leurre. */
  const VAGUE = [/non d[ée]taill/i, /non d[ée]velopp/i, /^renforce la transmission inhibitrice/i, /^comparaison/i, /^effets s[ée]rotoninergiques [ée]voqu/i, /cible pr[ée]cise/i];
  const META_SIG = /exemples du cours|ligands naturels/i;
  // Jamais proposés comme leurres : trop généraux, vrais pour beaucoup de classes.
  const NO_DECOY = [/^r[ée]cepteurs coupl[ée]s aux prot[ée]ines G$/i, /hyperactivit[ée] des circuits m[ée]dullaires/i];
  // Leurres interdits pour une classe précise (propriété réelle hors cours mais connue).
  const NO_DECOY_FOR = { tricyclique: [/antimuscarin/i, /H1/] };
  const isVague = t => !t || VAGUE.some(r => r.test(t));
  // Retire les clauses « détails non développés » d'un mécanisme.
  function cleanMec(t) { return String(t || '').split(/\s;\s/).filter(p => !/non d[ée]taill|non d[ée]velopp/i.test(p)).join(' ; ').trim(); }
  function mecList(c) {
    const out = [], seen = new Set(), tn = norm(c.target);
    c.molecules.forEach(m => {
      const t = cleanMec(m.mecanisme), n = norm(t);
      if (!t || isVague(t) || seen.has(n) || n === tn) return;
      seen.add(n); out.push(t);
    });
    return out;
  }
  const courseLabel = d => String(d.blurb || d.title || d.name).replace(/\.\s*$/, '');
  const distOf = (P, c) => P.districts.find(d => d.id === c.district) || { id: c.district, name: c.district };

  /* Bonnes réponses affichables (SHOW), réponses à exclure des leurres (EXCL), textes offerts comme leurres (POOL). */
  const notes = c => c.molecules.map(m => m.note).filter(Boolean);
  const SHOW = {
    affix: c => c.affix ? [c.affix] : [],
    repere: c => c.molecules.map(m => m.n),
    repere2: c => c.molecules.map(m => m.n),
    target: c => isVague(c.target) ? [] : [c.target],
    indication: c => [c.signature],
    // une entrée par molécule : le mécanisme partagé par la majorité sort plus souvent
    mecanisme: c => { const ok = new Set(mecList(c).map(norm)); return c.molecules.map(m => cleanMec(m.mecanisme)).filter(t => ok.has(norm(t))); },
    cours: (c, P) => [courseLabel(distOf(P, c))]
  };
  const EXCL = {
    affix: c => SHOW.affix(c),
    repere: c => SHOW.repere(c),
    repere2: c => SHOW.repere(c),
    target: c => [c.target, c.mechanism, c.name].concat(mecList(c), notes(c)),
    mecanisme: c => [c.target, c.mechanism, c.name].concat(mecList(c), notes(c)),
    indication: c => [c.signature].concat(c.molecules.map(m => m.indication), notes(c)),
    cours: (c, P) => SHOW.cours(c, P)
  };
  const POOL = {
    affix: o => o.affix ? [o.affix] : [],
    repere: o => o.molecules.map(m => m.n),
    target: o => isVague(o.target) ? [] : [o.target],
    indication: o => META_SIG.test(o.signature) ? [] : [o.signature],
    mecanisme: o => mecList(o)
  };
  POOL.repere2 = POOL.repere;
  const LABEL = { affix: 'Affixe', repere: 'Molécule repère', repere2: 'Autre molécule repère', target: 'Cible', indication: 'Indication', mecanisme: 'Mécanisme', cours: 'Cours' };

  /* Classes dont les textes se recouvrent trop : jamais leurres l'une pour l'autre. */
  const SIB = {
    target: [['isrs', 'irsna', 'tricyclique'], ['bzd', 'zdrug', 'gaba_ligand'], ['gaba_pot', 'gaba_ligand'], ['opioide', 'opio_dig', 'psychoactif', 'peptide_endo']],
    mecanisme: [['isrs', 'irsna', 'tricyclique'], ['bzd', 'zdrug', 'gaba_pot'], ['gaba_pot', 'gaba_ligand'], ['gaba_pot', 'gaba_meta'], ['opioide', 'opio_dig', 'peptide_endo', 'psychoactif']],
    repere: [['opioide', 'opio_dig', 'peptide_endo', 'psychoactif'], ['nitre', 'no_nos']],
    indication: [['p2y12', 'purine_autres'], ['nitre', 'no_nos'], ['opioide', 'psychoactif', 'opio_dig', 'palier1'], ['sero_autres', 'isrs', 'irsna', 'tricyclique', 'alpha2', 'imao', 'melato']]
  };
  const sib = (kind, a, b) => (SIB[kind] || []).some(g => g.includes(a) && g.includes(b));

  /* Oppositions soulignées par le cours : leurres prioritaires, même si les mots se recoupent.
     Chaque entrée pointe vers un texte réel de molecules.js (vérifié par le test). */
  const CONTRAST = [
    { cls: 'bzd', kind: 'mecanisme', from: 'gaba_pot', re: /dur[ée]e d.ouverture/i },      // BZD fréquence / barbiturique durée
    { cls: 'gaba_pot', kind: 'mecanisme', from: 'bzd', re: /fr[ée]quence d.ouverture/i },
    { cls: 'bzd', kind: 'mecanisme', from: 'gaba_ligand', re: /^Diminuent la fr[ée]quence/i }, // β-carbolines
    { cls: 'bzd', kind: 'mecanisme', from: 'gaba_ligand', re: /^Antagonisme comp[ée]titif au site BZD/i }, // flumazénil
    { cls: 'bzd', kind: 'target', from: 'gaba_pot', re: /hors site BZD/i },
    { cls: 'zdrug', kind: 'target', from: 'gaba_pot', re: /hors site BZD/i },
    { cls: 'ara2', kind: 'affix', from: 'sentan', re: /sentan/i },                           // -sartan / -sentan
    { cls: 'sentan', kind: 'affix', from: 'ara2', re: /sartan/i },
    { cls: 'ara2', kind: 'target', from: 'sentan', re: /endoth/i },
    { cls: 'sentan', kind: 'target', from: 'ara2', re: /AT1/ },
    { cls: 'ara2', kind: 'indication', from: 'sentan', re: /HTAP/ },
    { cls: 'sentan', kind: 'indication', from: 'ara2', re: /HTA/ },
    { cls: 'iec', kind: 'target', from: 'ara2', re: /AT1/ },                                 // IEC / ARA-II
    { cls: 'ara2', kind: 'target', from: 'iec', re: /ECA/ },
    { cls: 'iec', kind: 'mecanisme', from: 'ara2', re: /AT1/ },
    { cls: 'ara2', kind: 'mecanisme', from: 'iec', re: /ECA/ },
    { cls: 'p2y12', kind: 'mecanisme', from: 'purine_autres', re: /COX-1/ },                 // aspirine ≠ anti-P2Y12
    { cls: 'adenosine', kind: 'mecanisme', from: 'xanthine', re: /^Antagoniste comp[ée]titif/i }, // adénosine / caféine
    { cls: 'xanthine', kind: 'mecanisme', from: 'adenosine', re: /^Active notamment/i },
    { cls: 'isrs', kind: 'mecanisme', from: 'irsna', re: /noradr[ée]naline/i }               // ISRS sélectif / IRSNA double
  ];

  function candidates(P, c, kind) {
    const ex = (EXCL[kind] || SHOW[kind])(c, P), exN = new Set(ex.map(norm));
    const out = [], seen = new Set(exN);
    if (kind === 'cours') {
      P.districts.forEach(d => { if (d.id === c.district) return; const t = courseLabel(d), n = norm(t); if (seen.has(n)) return; seen.add(n); out.push({ text: t, src: d.id, tier: 1 }); });
      return out;
    }
    const forced = CONTRAST.filter(k => k.cls === c.id && k.kind === kind);
    P.classes.forEach(o => {
      if (o === c) return;
      POOL[kind](o).forEach(text => {
        const n = norm(text);
        if (!n || seen.has(n)) return;
        const isC = forced.some(k => k.from === o.id && k.re.test(text));
        if (!isC) {
          if (kind === 'affix') { if (affixClash(text, o.affixKind, c.affix, c.affixKind)) return; }
          else if (kind === 'repere' || kind === 'repere2') { if (sib('repere', c.id, o.id)) return; }
          else {
            if (sib(kind, c.id, o.id)) return;
            if (isVague(text) || NO_DECOY.some(r => r.test(text)) || (NO_DECOY_FOR[c.id] || []).some(r => r.test(text))) return;
            if (ex.some(r => similar(text, r))) return;
          }
        }
        seen.add(n);
        let tier = isC ? -1 : (o.district === c.district ? 0 : 1);
        if (kind === 'affix' && !isC) tier += (o.affixKind === c.affixKind ? 0 : 2);
        out.push({ text, src: o.id, tier });
      });
    });
    return out;
  }

  function makeSlot(P, c, kind, rng, nOpt, avoid) {
    avoid = avoid || new Set();
    const show = SHOW[kind](c, P).filter(t => !avoid.has(norm(t)));
    const correct = show[Math.floor(rng() * show.length)];
    const answers = (EXCL[kind] || SHOW[kind])(c, P);
    const cands = candidates(P, c, kind).filter(x => !avoid.has(norm(x.text))).map(x => Object.assign(x, { r: rng() }));
    cands.sort((a, b) => a.tier - b.tier || a.r - b.r);
    const leurres = cands.slice(0, nOpt - 1);
    const options = shuffle([{ text: correct, ok: true, src: c.id }].concat(leurres.map(l => ({ text: l.text, ok: false, src: l.src }))), rng);
    return { kind, label: LABEL[kind], answers, options };
  }

  function kindsFor(c, level) {
    level = Math.max(1, Math.min(3, level || 1));
    const base = [c.affix ? 'affix' : 'repere'];
    if (SHOW.target(c).length) base.push('target');
    base.push('indication');
    const extra = [];
    if (mecList(c).length) extra.push('mecanisme');
    if (c.affix) extra.push('repere');
    extra.push('cours');
    if (c.molecules.length >= 2) extra.push('repere2');
    while (base.length < 3 && extra.length) base.push(extra.shift());
    return base.concat(extra.slice(0, level - 1));
  }

  function makeRecipe(P, c, level, rng, nOpt) {
    rng = rng || Math.random; nOpt = nOpt || 4; level = Math.max(1, Math.min(3, level || 1));
    const avoid = new Set(), slots = [];
    kindsFor(c, level).forEach(k => {
      const s = makeSlot(P, c, k, rng, nOpt, (k === 'repere' || k === 'repere2') ? avoid : null);
      if (k === 'repere' || k === 'repere2') s.options.forEach(o => avoid.add(norm(o.text)));
      slots.push(s);
    });
    return { cls: c, level, slots };
  }

  function uniqueField(P, c, field) {
    const mode = field === 'target' ? 'jac' : 'share';
    if (field === 'target' && isVague(c.target)) return false;
    return !P.classes.some(o => o !== c && o[field] && similar(o[field], c[field], mode));
  }

  /* Commandes écrites à la main : chaque phrase reprend la cible, le mécanisme ou l'indication de la classe dans molecules.js. */
  const ORDERS = {
    triptan: ['Il me faut un agoniste 5-HT1B/1D pour une crise migraineuse.'],
    isrs: ['Un antidépresseur qui bloque seulement SERT, la recapture de la sérotonine.'],
    irsna: ['Un antidépresseur qui bloque la recapture de la sérotonine ET de la noradrénaline.'],
    tricyclique: ['Un vieil antidépresseur à trois cycles, qui bloque la recapture des monoamines.'],
    alpha2: ['Un antidépresseur qui lève le frein α2 présynaptique.'],
    imao: ['Un antidépresseur qui désarme la monoamine oxydase.'],
    melato: ['Quelque chose sur les récepteurs MT1 / MT2, pour le rythme veille–sommeil.'],
    antipsy: ['Un antipsychotique atypique : une touche de 5-HT en plus du D2.'],
    setron: ['Un antagoniste 5-HT3 contre les nausées et vomissements.'],
    sero_autres: ['Un agoniste 5-HT1A contre l’anxiété… ou un agoniste 5-HT4 pour la constipation.'],
    liberateur: ['Un exemple du cours qui vide les vésicules : libération massive de monoamines.'],
    bzd: ['Un anxiolytique qui augmente la fréquence d’ouverture du canal GABA-A.'],
    zdrug: ['Un hypnotique « Z » pour l’insomnie : site BZD, préférence α1.'],
    gaba_pot: ['Un anesthésique général qui potentialise le GABA-A, hors du site BZD.', 'Un barbiturique : il allonge la durée d’ouverture du canal GABA-A.'],
    gaba_ligand: ['Vite, un antidote des benzodiazépines !', 'Un outil qui se fixe sur le récepteur GABA-A : site du GABA, pore ou site BZD.'],
    gaba_meta: ['Un antiépileptique qui laisse plus de GABA disponible (GABA-T, GAT…).'],
    gabab: ['Un agoniste GABA-B contre la spasticité.'],
    nmda: ['Un antagoniste du récepteur-canal NMDA du glutamate.'],
    glu_lib: ['Un antiépileptique qui freine la libération présynaptique de glutamate.'],

function pool() { return P.classes.filter(c => S.dist === 'all' || c.district === S.dist); }
function pickClass() {
  const due = new Set(PR.due(30)); const cs = pool(); let best = cs[0], bs = -1e9;
  cs.forEach(c => {
    const un = c.molecules.filter(m => !S.found[m.n]).length;
    const m = c.molecules.reduce((a, x) => a + PR.mastery(x.n), 0) / c.molecules.length;
    let s = (un ? 1.2 : 0) + (S.err[c.id] || 0) * 0.3 + (1 - m) * 1.4 - (S.cls[c.id] || 0) * 0.12 + (c.molecules.some(x => due.has(x.n)) ? 0.6 : 0) + Math.random() * 1.8;
    if (c.id === G.lastCls) s -= 6;

}

function cardSparkle() {
  setTimeout(() => {
    const el = $('#ovIn .mcard'); if (!el) return; const r = el.getBoundingClientRect();
    FX.burst(r.left + r.width / 2, r.top + r.height * 0.3, { n: 46, colors: [getComputedStyle(el).getPropertyValue('--c').trim() || '#fff', '#ffffff', '#ffbe55'], speed: 320, g: 260, life: 1 });
  }, RM ? 0 : 380);
}
function showCard(n, info, caption, done) {
  SND.reveal(); buzz(15);
  ovOpen(`<div class="ov-stack"><div class="ov-cap">${esc(caption)}</div>${cardHTML(n, info && info.isNew ? 'Nouvelle !' : '')}
    <button type="button" class="btn main" data-act="ok">${info && info.isNew ? 'Au grimoire ✦' : 'Continuer'}</button></div>`,
    act => { if (act === 'ok' || act === 'escape') { ovClose(); afterDiscovery(info, done); } });
  cardSparkle();
}
function afterDiscovery(info, done) {
  if (info && info.isNew && info.classFull) {
    toast('Classe complète : ' + dname(info.cls) + ' ✦'); gainXP(15, 'classe complète');
  }
  if (info && info.isNew && info.distFull) { S.done[info.cls.district] = 1; save(); celebrate(info.cls.district, done); return; }
  done && done();
}
function moleculeStep(c, done) {
  const undisc = c.molecules.filter(m => !S.found[m.n]);
  const known = c.molecules.length - undisc.length;
  const quiz = undisc.length === 0 || (known > 0 && c.molecules.length > 1 && Math.random() < 0.45);
  if (!quiz) {
    const n = rnd(undisc).n; PR.record(n, true); const info = discover(n);
    showCard(n, info, 'Une molécule surgit de l’alambic', done);
  } else askQuiz(c, done);
}
function askQuiz(c, done) {
  const correct = c.molecules.map(m => ({ n: m.n, s: PR.mastery(m.n) + Math.random() * 0.35 })).sort((a, b) => a.s - b.s)[0].n;
  const own = new Set(c.molecules.map(m => m.n));
  let others = E.shuffle(P.all.filter(m => m.cls.district === c.district && !own.has(m.n)));
  if (others.length < 3) others = others.concat(E.shuffle(P.all.filter(m => m.cls.district !== c.district && !own.has(m.n))));
  const opts = E.shuffle([correct].concat(others.slice(0, 3).map(m => m.n)));
  ovOpen(`<div class="ov-stack"><div class="quiz"><div class="q-k">L’alambic goutte…</div><div class="q-t">Quelle molécule vient de se condenser ?</div>
    <div class="q-s">Elle sort de la cuve « ${esc(dname(c))} ».</div>
    <div class="qopts">${opts.map(n => `<button type="button" class="qa" data-act="a" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div></div></div>`,
    (act, b) => {
      if (act !== 'a' || !b || b.disabled) return;
      const pickN = b.dataset.n, ok = pickN === correct;
      $('#ovIn').querySelectorAll('.qa').forEach(x => { x.disabled = true; if (x.dataset.n === correct) x.classList.add('right'); });
      PR.record(correct, ok);
      if (ok) {
        SND.success(); gainXP(4, 'molécule'); const info = discover(correct);
        setTimeout(() => { ovClose(); showCard(correct, info, info.isNew ? 'Bien nommée — elle rejoint le grimoire' : 'Bien nommée !', done); }, RM ? 150 : 550);
      } else {
        b.classList.add('wrong'); SND.wrong(); buzz([30, 30, 30]);
        PR.record(pickN, false);
        setTimeout(() => { ovClose(); showCard(correct, { isNew: false }, 'C’était elle — à revoir', done); }, RM ? 400 : 1100);
      }
    });
}

/* ---------- Grand Œuvre (quartier complet) ---------- */
function celebrate(did, done) {
  const d = DIST[did]; SND.fanfare(); buzz([60, 40, 60, 40, 120]);
  FX.flash('255,214,140', 0.6);
  const W = window.innerWidth;
  for (let k = 0; k < 4; k++) setTimeout(() => FX.burst(W * (0.15 + 0.7 * Math.random()), window.innerHeight * 0.35, { n: 70, colors: ['#ffbe55', '#ffffff', d.color, '#7dffcf'], speed: 460, g: 420, life: 1.4 }), k * 260);
  gainXP(50, 'Grand Œuvre');
  ovOpen(`<div class="ov-stack" style="--c:${d.color}"><div class="ov-cap">Page du grimoire complète</div><div class="big">Grand Œuvre</div>
    <div class="big" style="font-size:26px">${esc(d.name)}</div><p style="text-align:center;color:var(--parch);font-family:var(--f-it);font-style:italic;margin:0">Toutes les molécules du quartier sont distillées. La page brille pour toujours.</p>
    <button type="button" class="btn main" data-act="ok">Splendide</button></div>`, act => { if (act === 'ok' || act === 'escape') { ovClose(); done && done(); } });
}

/* ---------- Fusions ---------- */
function pickFusion() {
  const wantCursed = Math.random() < 0.55;
  let cands = FUS.filter(f => f.ok !== wantCursed && f.id !== G.lastFus);
  if (!cands.length) cands = FUS.filter(f => f.id !== G.lastFus);
  const w = cands.map(f => (S.fus[f.id] ? 1 : 3) * (f.parts.some(p => S.dist === 'all' || CLS[p.cls].district === S.dist) ? 1.5 : 1));
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cands.length; i++) { r -= w[i]; if (r <= 0) { G.lastFus = cands[i].id; return cands[i]; } }
  G.lastFus = cands[0].id; return cands[0];
}
let pourTimers = [];
function newFusion(asOrder) {
  stopTimer(); pourTimers.forEach(clearTimeout); pourTimers = [];
  if (!FUS.length) { setMode('atelier'); return; }
  const f = pickFusion(), cl = rnd(CLIENTS);
  const say = rnd(['% : même mécanisme, non ? Je les fonds dans un seul chaudron.', 'On m’a dit que % agissent pareil. Tu forges ?', 'Je voudrais fondre % en une seule potion : c’est la même chose.', '% : même cible, même effet ? Ça fusionne ?']);
  G.phase = 'fusion'; G.rec = null; G.busy = false;
  G.fusion = { f, asOrder, client: cl, say, poured: 0, dur: asOrder ? 15000 : 0 };
  if (!asOrder) { S.n++; save(); }
  FL.reset(); FL.setTag(f.parts.length === 3 ? 'Triple' : 'Fusion');
  setStage(asOrder ? 'Comptoir · creuset' : 'Creuset de fusion', 'les flacons se versent…'); setHint('');
  renderLab();
  f.parts.forEach((p, i) => pourTimers.push(setTimeout(() => {
    if (G.fusion && G.fusion.f === f) { G.fusion.poured = i + 1; FL.add(hexRgb(CLS[p.cls].color)); renderSlots(); }
  }, (RM ? 80 : 420) * (i + 1))));
  if (asOrder) startTimer();
}
function judgeFusion(curse) {
  if (G.phase !== 'fusion') return;
  const F = G.fusion, f = F.f, right = curse === !f.ok;
  stopTimer(); pourTimers.forEach(clearTimeout); pourTimers = []; F.poured = f.parts.length;
  G.phase = 'fusionDone';
  f.parts.forEach(p => { if (MOL[p.mol]) PR.record(p.mol, right); });
  const ce = FL.center(), n = FL.neck();
  let title, kind, xp = 0;
  if (!f.ok && !curse) {
    FL.explode(); SND.boom(); buzz([80, 40, 160]); FX.flash('255,80,60', 0.75);
    FX.burst(ce.x, ce.y, { n: 150, colors: ['#ff5468', '#ffbe55', '#ff5fd2', '#ffffff'], speed: 620, life: 1.3, size: 4, g: 420 });
    FX.burst(n.x, n.y, { n: 24, type: 'smoke', colors: ['#3b3340', '#56404f'], speed: 90, ang: -Math.PI / 2, spread: 2, life: 2.2, size: 16, g: -40 });
    FX.ring(ce.x, ce.y, '#ff5468', 260);
    title = '💥 BOUM ! Ce n’est pas le même mécanisme'; kind = '';
  } else if (!f.ok && curse) {
    FL.setColor([200, 70, 220]); SND.seal(); buzz(30); FX.ring(ce.x, ce.y, '#ff5fd2', 150); FX.ring(ce.x, ce.y, '#ffffff', 90);
    FX.burst(ce.x, ce.y, { n: 40, colors: ['#ff5fd2', '#c38bff', '#ffffff'], speed: 260, g: 0, drag: 2.5, life: 0.9 });
    title = '☠ Bien vu : piège du cours démasqué'; kind = 'purple'; xp = 12;
  } else if (f.ok && !curse) {
    FL.success([255, 200, 90]); SND.forge(); buzz([20, 60, 20]); FX.flash('255,214,140', 0.45);
    FX.burst(ce.x, ce.y + 20, { n: 110, colors: ['#ffbe55', '#ffe8a8', '#ffffff', '#ff9a3c'], speed: 520, ang: -Math.PI / 2, spread: 2.2, life: 1.2, size: 3, g: 700 });
    FX.ring(ce.x, ce.y, '#ffbe55', 200);
    title = '⚒ Fusion réussie : même mécanisme'; kind = 'gold'; xp = 10;
  } else {
    FL.setColor([120, 130, 130]); SND.fizzle(); FX.burst(n.x, n.y, { n: 14, type: 'smoke', colors: ['#7d8a88'], speed: 40, ang: -Math.PI / 2, spread: 1, life: 1.6, size: 12, g: -30 });
    title = 'Pschitt… elles agissaient bien pareil'; kind = '';
  }
  let tipTxt = '';
  if (right) {
    S.fus[f.id] = 1;
    if (F.asOrder) { G.combo++; S.best = Math.max(S.best || 0, G.combo); const tip = F.late ? 0 : Math.round(10 * (F.frac || 0) * (1 + 0.2 * Math.min(G.combo, 10))); xp += tip; if (tip) { tipTxt = ' · pourboire ' + tip; setTimeout(() => SND.coin(), 500); } }
  } else if (F.asOrder) G.combo = 0;
  save();
  gainXP(xp, tipTxt.replace(' · ', ''));
  const verdict = f.ok ? 'Même mécanisme' : 'À distinguer';
  const mecs = f.parts.map(p => MOL[p.mol] ? `<span class="src"><b>${esc(p.mol)}</b> : ${esc(MOL[p.mol].mecanisme)}${MOL[p.mol].pages ? ' (p. ' + esc(MOL[p.mol].pages) + ')' : ''}</span>` : '').join('');
  const quotes = (f.lines || []).map(l => `<span class="src">Grimoire · ${esc(l.who)} : « ${esc(l.text)} »</span>`).join('');
  setHint(`<p><b>${esc(title)}</b></p><p>${esc(verdict)} : ${esc(f.why)}</p>${mecs}${quotes}`, kind);
  renderOrder(); renderSlots(); renderShelf(); renderActions();
  const nb = $('#next'); if (nb) setTimeout(() => nb.focus({ preventScroll: true }), 50);
}
function newForge() { newFusion(false); }

/* ---------- Grimoire ---------- */
let gPage = null;
function distStats(did) {
  const ms = P.all.filter(m => m.cls.district === did); const f = ms.filter(m => S.found[m.n]).length;
  return { f, t: ms.length };
}
function renderGrim() {
  const box = $('#grim');
  if (!gPage) gPage = (S.dist !== 'all' && DIST[S.dist]) ? S.dist : P.districts[0].id;
  const tot = foundCount(), clsDone = P.classes.filter(c => S.cls[c.id]).length, fusDone = FUS.filter(f => S.fus[f.id]).length;
  const tabs = P.districts.map(d => { const s = distStats(d.id); return `<button type="button" role="tab" class="gtab${s.f === s.t ? ' done' : ''}" style="--dc:${d.color}" data-p="${d.id}" aria-selected="${gPage === d.id}">${esc(d.name)}<span class="pc">${Math.round(100 * s.f / s.t)}%</span></button>`; }).join('') +
    `<button type="button" role="tab" class="gtab" style="--dc:#ffbe55" data-p="forge" aria-selected="${gPage === 'forge'}">Forge<span class="pc">${fusDone}/${FUS.length}</span></button>`;
  let page = '';
  if (gPage === 'forge') {
    page = `<div class="gpage${fusDone === FUS.length ? ' complete' : ''}" style="--dc:#ffbe55"><h2>Livre des fusions</h2><p class="blurb">Molécules qui agissent pareil, et confusions que le cours signale.</p>
      <div class="gprog"><i style="width:${100 * fusDone / FUS.length}%"></i></div>` +
      FUS.map(f => S.fus[f.id]
        ? `<div class="gfus"><div class="ft">${esc(f.parts.map(p => p.mol).join(' + '))}<span class="tag ${f.ok ? 'ok' : 'ko'}">${f.ok ? 'MÊME MÉCANISME' : 'PIÈGE'}</span></div><div class="fw">${esc(f.why)}</div></div>`
        : `<div class="gfus unk"><div class="ft">??? + ???${f.parts.length > 2 ? ' + ???' : ''}</div></div>`).join('') + '</div>';
  } else {
    const d = DIST[gPage], s = distStats(gPage), complete = s.f === s.t;
    page = `<div class="gpage${complete ? ' complete' : ''}" style="--dc:${d.color}">${complete ? '<div class="seal">GRAND<br>ŒUVRE</div>' : ''}<h2>${esc(d.name)}</h2><p class="blurb">${esc(d.blurb)} · ${s.f}/${s.t} molécules</p>
      <div class="gprog"><i style="width:${100 * s.f / s.t}%"></i></div>` +
      P.classes.filter(c => c.district === gPage).map(c => {
        const f = c.molecules.filter(m => S.found[m.n]).length, full = f === c.molecules.length;
        return `<div class="gclass${full ? ' full' : ''}"><div class="gc-h"><span class="gc-n">${esc(dname(c))}</span><span class="gc-a">${esc(c.affix || '—')}</span><span class="gc-c">${f}/${c.molecules.length}</span></div>
          <div class="gms">${c.molecules.map(m => S.found[m.n] ? `<button type="button" class="gm${m.trap ? ' trap' : ''}" data-n="${esc(m.n)}">${esc(m.n)}</button>` : '<span class="gm unk" aria-label="molécule inconnue">???</span>').join('')}</div></div>`;
      }).join('') + '</div>';
  }
  box.innerHTML = `<div class="gstats"><span><b>${tot}</b>/${P.all.length} molécules</span><span><b>${clsDone}</b>/${P.classes.length} classes transmutées</span><span><b>${fusDone}</b>/${FUS.length} fusions</span></div>
    <div class="gtabs" role="tablist">${tabs}</div>${page}`;
  const sel = box.querySelector('.gtab[aria-selected=true]'); if (sel && sel.scrollIntoView) try { sel.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {}
}
$('#grim').addEventListener('click', e => {
  const t = e.target.closest('.gtab'); if (t) { gPage = t.dataset.p; SND.page(); renderGrim(); return; }
  const m = e.target.closest('.gm[data-n]');
  if (m) { const n = m.dataset.n; SND.reveal(); ovOpen(`<div class="ov-stack">${cardHTML(n, '')}<button type="button" class="btn" data-act="ok">Fermer</button></div>`, act => { if (act) ovClose(); }); }
});

/* ---------- Modes ---------- */
function setMode(m) {
  stopTimer(); pourTimers.forEach(clearTimeout); pourTimers = [];
  G.mode = m; S.mode = m; save();
  document.querySelectorAll('#modes .mode').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m ? 'true' : 'false'));
  const isG = m === 'grimoire'; $('#lab').hidden = isG; $('#grim').hidden = !isG;
  if (isG) { renderGrim(); return; }
  if (m === 'atelier') newAtelier();
  else if (m === 'commande') { G.combo = 0; newCommande(); }
  else newForge();
  FL.resize(); kick(3000);
}
$('#modes').addEventListener('click', e => { const b = e.target.closest('.mode'); if (b) { SND.pick(); setMode(b.dataset.m); } });
$('#snd').addEventListener('click', () => { S.sound = !S.sound; save(); renderHUD(); if (S.sound) SND.pick(); });

/* ---------- Interactions ---------- */
$('#order').addEventListener('change', e => { if (e.target.id === 'distSel') { S.dist = e.target.value; save(); gPage = null; newAtelier(); } });
$('#order').addEventListener('click', e => { if (e.target.closest('#skip')) { SND.page(); if (G.phase === 'fusion' || G.phase === 'fusionDone') newForge(); else newAtelier(); } });
$('#slots').addEventListener('click', e => {
  const b = e.target.closest('.slot[data-i]'); if (!b || G.phase !== 'craft' || G.busy) return;
  const i = +b.dataset.i; if (G.locked[i]) return;
  if (G.active === i && G.placed[i] >= 0) { G.placed[i] = -1; SND.bloop(); } else { G.active = i; SND.pick(); }
  renderSlots(); renderShelf(); renderActions();
});
$('#actions').addEventListener('click', e => {
  if (e.target.closest('#go')) distill();
  else if (e.target.closest('#reveal')) revealRecipe();
  else if (e.target.closest('#next')) { if (G.fusion && G.fusion.asOrder) newCommande(); else newForge(); }
});
const shelf = $('#shelf');
let drag = null, justDragged = false;
function overStage(x, y) { for (const el of [stageEl, $('#slots')]) { const r = el.getBoundingClientRect(); if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return true; } return false; }
shelf.addEventListener('pointerdown', e => {
  const ch = e.target.closest('.chip'); if (!ch || G.busy || G.phase !== 'craft') return;
  drag = { ch, j: +ch.dataset.j, x: e.clientX, y: e.clientY, id: e.pointerId, on: false, ghost: null };
  try { ch.setPointerCapture(e.pointerId); } catch (_) {}
});
shelf.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.on && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 10) {
    drag.on = true; drag.ghost = drag.ch.cloneNode(true); drag.ghost.classList.add('ghost'); document.body.appendChild(drag.ghost); SND.pick(); kick(4000);
  }
  if (drag.on) { drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px'; stageEl.classList.toggle('drop', overStage(e.clientX, e.clientY)); }
});
function endDrag(e, cancel) {
  if (!drag) return; const d = drag; drag = null;
  if (d.on) {
    justDragged = true; setTimeout(() => { justDragged = false; }, 60);
    if (d.ghost) d.ghost.remove(); stageEl.classList.remove('drop');
    if (!cancel && overStage(e.clientX, e.clientY)) place(d.j);
  }
}
shelf.addEventListener('pointerup', e => endDrag(e, false));
shelf.addEventListener('pointercancel', e => endDrag(e, true));
shelf.addEventListener('click', e => {
  const v = e.target.closest('[data-v]'); if (v) { judgeFusion(v.dataset.v === 'curse'); return; }
  if (justDragged) return;
  const ch = e.target.closest('.chip'); if (ch) place(+ch.dataset.j);
});
$('#flask').addEventListener('pointerdown', e => {
  const r = e.currentTarget.getBoundingClientRect(); FL.splash(e.clientX - r.left, e.clientY - r.top); SND.bloop(); buzz(5);
});
let unlocked = false;
document.addEventListener('pointerdown', () => { if (!unlocked) { unlocked = true; SND.unlock(); } }, { capture: true });
let rsT = 0;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { FL.resize(); FX.resize(); kick(600); }, 120); });

/* ---------- Démarrage ---------- */
FX.resize(); FL.resize(); FL.setReceiver(foundCount() / P.all.length, true);
renderHUD();
setMode(['atelier', 'commande', 'forge', 'grimoire'].includes(S.mode) ? S.mode : 'atelier');
})();
</script>
</body>
</html>
